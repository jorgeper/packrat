[project]
name = "packrat"
version = "0.1.0"
description = "A simple FTP backup CLI: download a remote folder, optionally zip it with a datestamped name."
requires-python = ">=3.11"
dependencies = ["rich>=13.0"]

[project.scripts]
packrat = "packrat:main"

[dependency-groups]
dev = ["pytest>=8.0", "pyftpdlib>=2.0", "pyinstaller>=6.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["packrat.py"]
