name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-latest
            binary: dist/packrat
            asset: packrat-macos-arm64
          - os: windows-latest
            binary: dist/packrat.exe
            asset: packrat-windows.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Run tests
        run: uv run pytest -q
      - name: Build binary
        run: uv run pyinstaller --onefile --name packrat packrat.py
      - name: Rename asset
        shell: bash
        run: mv ${{ matrix.binary }} ${{ matrix.asset }}
      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.asset }}
